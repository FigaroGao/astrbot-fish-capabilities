<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小鲸的活动与记忆</title>
<style>
:root{font:15px/1.6 system-ui;color:#193746;background:#f2f7f9}*{box-sizing:border-box}body{margin:0}header,main{max-width:1180px;margin:auto;padding:22px}h1{font-size:25px;margin:0}h2{font-size:19px}p{margin:8px 0;color:#546f7c}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button,input,select,textarea{font:inherit;border:1px solid #b5cad4;border-radius:9px;padding:8px 12px;background:white;color:inherit}button{cursor:pointer}button:hover{background:#e1eef5}button.active{background:#245e78;color:white}textarea{width:100%;min-height:85px}label{display:block;margin:8px 0}input[type=text],select{max-width:100%}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.card{background:white;border:1px solid #d8e5eb;border-radius:14px;padding:16px;margin-bottom:12px;overflow:hidden}.card img.cover{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px}.muted{font-size:13px;color:#69828d}.tag{font-size:12px;background:#e9f3f7;border-radius:5px;padding:3px 7px;margin-right:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.65 ui-monospace,monospace;background:#edf3f6;padding:12px;border-radius:8px}#notice{position:sticky;top:0;z-index:2;padding:10px 22px;background:#dceff7;min-height:42px}a{color:#246782}.preview{max-width:100%;max-height:260px;object-fit:contain}section[hidden]{display:none}footer{padding:15px;color:#69828d}.danger{color:#a33a42}
</style></head><body>
<div id="notice" role="status">正在连接AstrBot管理页…</div>
<header><h1>小鲸的活动与记忆</h1><p>查看实际活动，整理表达与观察。所有修改沿用AstrBot管理员鉴权。</p><div class="toolbar"><label>记录范围 <select id="scope"></select></label><button id="refresh">刷新</button></div><nav id="nav"></nav></header>
<main><section id="videos"></section><section id="learning" hidden></section><section id="memes" hidden></section><section id="tasks" hidden></section><section id="metrics" hidden></section><section id="simulation" hidden></section></main>
<footer>历史摘要不等于当前事实；看到资料不等于完整观看视频。规则回放和模型预览均不发送QQ或B站消息。</footer>
<script type="module">
const $=id=>document.getElementById(id);let state={},active='videos';const bridge=window.AstrBotPluginPage;
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
const note=text=>$('notice').textContent=text;const date=v=>v?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Hong_Kong',dateStyle:'short',timeStyle:'short'}).format(new Date(v*1000)):'未知';
const card=(parent,title)=>{const c=el('article',undefined,'card');if(title)c.append(el('h2',title));parent.append(c);return c};
const button=(parent,text,fn)=>{const b=el('button',text);b.onclick=()=>run(fn);parent.append(b);return b};
const pre=(parent,value)=>parent.append(el('pre',typeof value==='string'?value:JSON.stringify(value,null,2)));
const field=(parent,label,value='',type='text')=>{const l=el('label',label);const e=type==='textarea'?el('textarea'):el('input');if(type!=='textarea')e.type=type;e.value=value;l.append(e);parent.append(l);return e};
async function run(fn){try{await fn()}catch(e){note('未完成：'+(e.message||'请求失败'));}}
async function api(operation,body={}){const r=await bridge.apiPost('page/action',{operation,scope:$('scope').value,...body});if(r.status!=='ok')throw new Error(r.message||'操作未确认');return r.data;}
async function load(){const r=await bridge.apiGet('page/state',{scope:$('scope').value||''});if(r.status!=='ok')throw new Error(r.message||'读取失败');state=r.data;const select=$('scope');if(!select.options.length){for(const s of state.scopes){const o=el('option',s.includes(':FriendMessage:')?'主人私聊':s);o.value=s;select.append(o);}select.value=state.scope;}render();note(state.indexing?'正在增量建立表情索引，可继续使用已有图库。':'已刷新 · 香港时间 '+date(Date.now()/1000));if(state.indexing)setTimeout(()=>run(load),2500);}
function render(){for(const id of ['videos','learning','memes','tasks','metrics','simulation'])$(id).replaceChildren();renderVideos();renderLearning();renderMemes();renderTasks();renderMetrics();renderSimulation();}
function renderVideos(){const host=$('videos');const bar=el('div',undefined,'toolbar');host.append(bar);button(bar,'补充旧视频封面（每次最多6张）',async()=>{const r=await api('covers');note('补充了 '+r.covers_updated+' 张封面');await load()});const grid=el('div',undefined,'grid');host.append(grid);for(const v of state.videos){const c=card(grid);if(v.cover){const img=el('img',undefined,'cover');img.src=v.cover;img.loading='lazy';img.referrerPolicy='no-referrer';img.alt=v.title;c.append(img)}const a=el('a',v.title);a.href=v.url;a.target='_blank';a.rel='noopener noreferrer';c.append(a,el('p','最近读取：'+date(v.last_read),'muted'),el('p',v.summary||'暂无文字摘要'),el('p',v.reflection||'暂无观影札记'));c.append(el('small',v.sampled_visual?'含抽样画面 · 不代表完整观看':'依据可用文字资料'));}const c=card(host,'实际活动与回执');for(const e of state.timeline.events){c.append(el('p',date(e.at)+' · '+e.summary),el('small','状态：'+e.state,'tag'));}}
function renderLearning(){const host=$('learning');const form=card(host,'新增表达或可修正的观察');const kind=el('select');for(const [k,n]of [['style_positive','自然表达样例'],['style_negative','不喜欢的表达'],['preference','明确偏好'],['observation','可修正的主观观察']]){const o=el('option',n);o.value=k;kind.append(o)}form.append(kind);const topic=field(form,'场景 / 话题');const text=field(form,'内容（最多600字）','','textarea');button(form,'由我确认并保存',async()=>{await api('note_save',{kind:kind.value,topic:topic.value,text:text.value});await load()});for(const r of state.notes){const c=card(host,r.topic||r.kind);c.append(el('span',r.kind+' · '+r.state+(r.expired?' · 已过期':''),'tag'),el('p',r.text),el('p','记录时间：'+date(r.stamp)+' · 版本 '+r.revision,'muted'));const edit=field(c,'修改内容',r.text,'textarea');button(c,'保存更正',async()=>{await api('note_save',{id:r.id,revision:r.revision,kind:r.kind,topic:r.topic,text:edit.value});await load()});for(const [status,name]of [['approved','批准'],['rejected','拒绝'],['archived','归档']])button(c,name,async()=>{await api('note_review',{id:r.id,revision:r.revision,state:status});await load()});const detail=el('details');detail.append(el('summary','查看来源'));pre(detail,r.source);c.append(detail);}const trace=card(host,'最近召回了什么');pre(trace,state.recall_traces);}
function renderMemes(){const host=$('memes');const top=card(host,'按内容找表情');top.append(el('p','已审核 '+state.semantic.approved_images+' 张，已建立语义索引 '+state.semantic.indexed_current+' 张'+(state.semantic.pending!==undefined?'，待处理 '+state.semantic.pending+' 张':'')+'。'));if(!state.semantic.available)top.append(el('p','尚未配置可用向量模型，仍可按已有文字说明找图。'));const q=field(top,'想表达什么');button(top,'找候选',async()=>{const r=await api('meme_search',{query:q.value});pre(top,r)});button(top,'增量建立索引（只用已有文字描述）',async()=>{await api('meme_index');await load()});for(const m of state.memes.entries){const c=card(host,m.id+' · '+m.category);const preview=el('div');c.append(preview);button(c,'查看图片',async()=>{const r=await bridge.apiGet('page/image',{id:m.id});if(r.status!=='ok')throw new Error(r.message);const img=el('img',undefined,'preview');img.src=r.data.url;img.alt=m.description||m.id;preview.replaceChildren(img)});const d=field(c,'画面描述',m.description||'','textarea'),t=field(c,'图中文字',m.image_text||''),u=field(c,'适用场景',m.usage_notes||''),tags=field(c,'标签（逗号分隔）',(m.tags||[]).join(','));const category=el('select');for(const name of ['happy','comfort','tease','confused','greeting','goodnight','sad','acknowledge']){const o=el('option',name);o.value=name;category.append(o)}category.value=m.category;c.append(category);const approved=field(c,'已审核', '', 'checkbox');approved.checked=m.approved===true;button(c,'保存图片说明',async()=>{await api('meme_save',{id:m.id,version:state.memes.version,description:d.value,image_text:t.value,usage_notes:u.value,tags:tags.value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),category:category.value,approved:approved.checked});await load()});}}
function renderTasks(){const host=$('tasks');host.append(el('p','香港时间。暂停不会撤回已经发送的内容；明确提醒不会被模型随意取消。'));for(const t of state.tasks.tasks){const c=card(host,t.name);c.append(el('p',t.action+' · '+t.timing),el('p','下次：'+(t.next_at||'暂无')+' · '+(t.enabled?'启用':'暂停')));button(c,t.enabled?'暂停':'恢复',async()=>{await api('task_pause',{id:t.id,enabled:!t.enabled});await load()});pre(c,t.last_run);}const c=card(host,'统一能力权限');pre(c,state.permissions);}
function renderMetrics(){const host=$('metrics');const c=card(host,'今天实际记录的用量');c.append(el('p',state.usage.instruction));pre(c,state.usage.stages);const d=card(host,'最近群聊接话判断');d.append(el('p','仅决策代码与指标，不记录完整思考过程。'));pre(d,state.intent_decisions);if(state.initiative){const a=card(host,'主动联系的候选与决定摘要');pre(a,state.initiative);}const t=card(host,'只读表达诊断');t.append(el('p','只提供规则线索，不是人味评分。不自动改字、不保存手动输入、不调用模型；具体喜好请在表达与观察中保存。'));const text=field(t,'想检查的回复','','textarea');const context=field(t,'对方本轮说的话（可留空）','','textarea');const scene=el('select');scene.setAttribute('aria-label','交流场景');for(const [value,label] of [['auto','按当前语境判断'],['chat','闲聊'],['empathy','倾诉'],['explain','解释'],['steps','步骤'],['compare','比较'],['data','数字与数据'],['public','公开评论']]){const option=el('option',label);option.value=value;scene.append(option);}t.append(scene);button(t,'只诊断，不改写',async()=>{pre(t,await api('tone_diagnose',{text:text.value,context:context.value,scene:scene.value}));});pre(t,state.tone||{records:[],instruction:'尚无诊断记录'});}
function renderSimulation(){const host=$('simulation');const c=card(host,'隔离的接话回放');c.append(el('p','默认只跑规则。勾选模型预览会调用一次判断模型，不能调用工具，不会发送任何消息。'));const input=field(c,'模拟消息JSON',JSON.stringify({messages:[{text:'这件事已经解决了',target:'other'}],muted:false},null,2),'textarea');const model=field(c,'调用一次模型预览','','checkbox');button(c,'运行模拟',async()=>{const result=await api('simulate',{scenario:JSON.parse(input.value),use_model:model.checked});pre(c,result)});}
for(const [id,title]of [['videos','看过的视频'],['learning','表达与观察'],['memes','表情图库'],['tasks','时间表与权限'],['metrics','用量与判断'],['simulation','模拟测试']]){const b=button($('nav'),title,()=>{active=id;for(const s of document.querySelectorAll('main>section'))s.hidden=s.id!==id;for(const n of $('nav').children)n.classList.toggle('active',n===b)});if(id===active)b.classList.add('active');}
$('refresh').onclick=()=>run(load);$('scope').onchange=()=>run(load);
if(!bridge){note('请从AstrBot「插件 → 小鲸能力 → 视图 → companion」打开，页面不接受独立免登录访问。')}else{run(async()=>{await bridge.ready();await load()})}
</script></body></html>
