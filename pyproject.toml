[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fish-capabilities-draft"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
bilibili = ["bilibili-api-python==17.4.1", "aiohttp>=3.9,<4"]
speech = ["dashscope>=1.24,<3"]
test = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["astrbot_plugin_fish_capabilities*"]

[tool.setuptools.package-data]
astrbot_plugin_fish_capabilities = ["*.json", "*.yaml", "*.md"]
